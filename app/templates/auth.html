{% extends 'base.html' %}
{% from "parts.html" import token, heading with context %}
{% block content %}<section class="panel auth">{{ heading(title) }}
<form method="post">{{ token() }}
<label>Username<input name="username" required minlength="3" maxlength="80" autocomplete="username"></label>
<label>Password<input name="password" type="password" required maxlength="128" {% if register %}minlength="10"{% endif %} autocomplete="{{ 'new-password' if register else 'current-password' }}"></label>
{% if register %}<p class="muted">Use at least 10 characters.</p>{% endif %}
<button class="button">{{ 'Create account' if register else 'Sign in' }}</button></form></section>{% endblock %}
